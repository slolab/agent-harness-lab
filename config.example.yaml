# Copy to config.yaml. Keep config.yaml and .env untracked.
#
# config.yaml holds non-secret selection; .env holds API keys only (see
# .env.example). `harness`, `provider`, and `model` each accept either a bare
# name or a {name, parameters} mapping — see "Other harness/provider
# combinations" at the bottom for worked examples.

harness: gemini       # gemini | opencode | agy | claude | claude-science | deepseek
provider: gemini      # anthropic | openai | gemini | vertex | openrouter
model: gemini-3.5-flash

# --- Workspace ---------------------------------------------------------
# AHL is for isolated, repeatable testing of skills/MCP servers, not for
# driving a persistent real project — so `workspace` is a *template*, by
# default. AHL snapshots it into runs/<id>/workspace/ fresh on every
# `ahl up` and mounts that copy, read-write; the template itself is never
# touched, so the same starting state is reusable across harnesses and
# capability versions, and the snapshot is a diffable run artifact.

workspace: ./projects/demo   # bare string -> install: copy (the default)

# Other forms:
#   workspace:                    # omitted entirely -> empty ephemeral
#                                  # workspace, e.g. for testing a skill
#                                  # against no seed data at all
#   workspace:
#     path: ./projects/demo
#     install: copy               # default, spelled out: fresh snapshot
#                                  # per run, template untouched
#   workspace:
#     path: ./projects/demo
#     install: mount               # opt-in: live bind-mount, edits persist
#                                   # straight into the template

# --- Capabilities: skills/MCP servers preinstalled into the harness ----
# See docs/capability-format.md for what a bundle looks like.
#
# Skill discovery is native for claude, gemini, opencode, agy, and deepseek. AHL maps
# local mount-mode skills directly into each harness's native skill directory.
# All other skill installs are delegated to `npx skills`, globally and
# non-interactively, with the installer agent inferred from `harness`.
# Claude Science currently exposes custom skill installation only in its UI;
# AHL prepares uploadable ZIPs and prints the one required manual upload step.
# MCP wiring isn't implemented yet (parsed, but skipped with a warning).
#
# `install: mount` — bind-mount a local `path` read-only for hot reload.
# `install: copy` — pass a local `path` to `npx skills`; the installed copy
# is writable and does not reflect later host edits.
# `install: npx` — resolve `source` remotely and install the named skill.
#
# A `kind: plugin` (a `.claude-plugin/` bundle shipping several skills) can be
# referenced once instead of listing each skill. Local (`mount`/`copy`) plugins
# are enumerated from `path`; an optional `skills:` list narrows the set. Remote
# (`npx`) plugins can't be enumerated on disk, so they require a `skills:` list
# naming which skills to install from `source`.

# capabilities:
#   # Local hot reload:
#   - kind: skill
#     name: biotope
#     install: mount
#     path: /absolute/or/repo-relative/path/to/biotope_by_claude
#   # Local snapshot through npx skills:
#   - kind: skill
#     name: biotope
#     install: copy
#     path: /absolute/or/repo-relative/path/to/biotope_by_claude
#   # Remote skill through npx skills:
#   - kind: skill
#     name: web-design-guidelines
#     install: npx
#     source: vercel-labs/agent-skills
#   # Remote plugin — install a chosen subset of its skills:
#   - kind: plugin
#     name: biotope
#     install: npx
#     source: https://github.com/biocypher/biotope
#     skills: [biotope-croissant, biocypher]

# --- Packages: local (not-yet-published) Python checkouts to preinstall --
# For a CLI or library a skill depends on that's still being developed
# alongside it (e.g. not published to PyPI yet).
#
# `install: mount` — bind-mount read-only; hot reload on host (hatchling
# editable OK; setuptools may need `copy` instead).
# `install: copy` — snapshot to runs/<id>/packages/<name>/, then `docker cp`
# into the container (writable, no mount). Pins version per run.
#
# AHL inspects `pyproject.toml`: CLIs get `uv tool install --editable`;
# libraries get `uv pip install --system --editable`.

# packages:
#   - name: biotope
#     install: mount   # hot reload: host edits picked up without rerunning `ahl up`
#     path: /absolute/or/repo-relative/path/to/biotope

# --- Provider parameters (Vertex express / Agent Platform key) ---------
# provider:
#   name: vertex
#   parameters:
#     project: your-gcp-project-id
#     location: global

# --- Model parameters (reserved for future use) -------------------------
# model:
#   name: gemini-3.5-flash
#   parameters:
#     thinking: true

# --- Other harness/provider combinations --------------------------------
# Gemini CLI on Vertex express:
#   harness: gemini
#   provider: {name: vertex, parameters: {project: ..., location: global}}
#
# Antigravity CLI (agy) — Gemini or Vertex express:
#   harness: agy
#   provider: {name: vertex, parameters: {project: ..., location: global}}
#
# Claude Code (Claude-account login; no API key):
#   harness: claude
#   provider: anthropic
#   # omit model to use the plan default; or set an explicit Claude model
#
# Claude Science (x64 glibc Linux only; Claude-account login; no API key):
#   harness:
#     name: claude-science
#     parameters:
#       port: 8000
#       # dangerously_no_sandbox: true  # fallback only if nested bwrap fails
#   provider: anthropic
#   # model is selected by the signed-in plan/app, not this config
#
# OpenCode (multi-provider; model as provider/model or bare name):
#   harness: opencode
#   provider: anthropic
#   model: claude-sonnet-4-6
#   # or provider: vertex + model: gemini-3.5-flash -> google-vertex/gemini-3.5-flash

# OpenRouter (Claude Code, OpenCode, or DeepSeek; requires OPENROUTER_API_KEY):
#   harness: claude
#   provider: openrouter
#   model: qwen/qwen3.7-flash   # exact provider-native ID; explicit model required
#   # OpenCode adds its own prefix: openrouter/qwen/qwen3.7-flash
#   # model: openrouter/auto becomes openrouter/openrouter/auto in OpenCode.
#
# DeepSeek official browser UI (OpenRouter only):
#   harness:
#     name: deepseek
#     parameters:
#       port: 3080             # integer 1..65535; host-loopback publication
#   provider: openrouter
#   model: qwen/qwen3.7-flash
#   # Start ahl-deepseek --port 3080, then open its printed authenticated URL.
#   # Native search needs DEEPSEEK_API_KEY, which AHL does not supply.
#   # Resume keeps sessions and skills; AHL refreshes its provider/model settings.
