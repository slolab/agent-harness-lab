[project]
name = "agent-harness-lab"
version = "0.1.0"
description = "Isolated agent harness lab for hands-on tool testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[project.scripts]
ahl = "ahl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unit tests run by default and in CI. Opt in with `-m docker` or `-m live`.
addopts = "--strict-markers -m 'not docker and not live'"
markers = [
    "docker: builds images or starts containers; local only",
    "live: calls a real provider and spends credit; local only, never CI",
]
